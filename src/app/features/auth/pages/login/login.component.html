<div class="min-h-screen flex flex-col">

    <app-navbar></app-navbar>
  
    <main class="flex-1 bg-[#efe8da] pt-24 px-6 pb-16">
  
        <div class="max-w-xl mx-auto">
  
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
    
                <div class="p-8">
        
                    <h1 class="text-3xl font-semibold text-[#756c59] mb-2">
                        Iniciar sesión
                    </h1>
        
                    <p class="text-[#8d917b] mb-8">
                        Accede a tu cuenta para realizar pedidos y gestionar tus compras
                    </p>
        
                    <form class="space-y-6">
                        <!-- Email -->
                        <div>
                            <label
                                for="email"
                                class="block text-sm font-medium text-[#756c59] mb-2"
                            >
                            Correo electrónico
                            </label>
                            <input
                                id="email"
                                type="email"
                                name="email"
                                autocomplete="off"
                                placeholder="ejemplo@email.com"
                                class="w-full rounded-xl border border-[#d3c7b6] bg-[#faf8f4] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#8d917b]"
                            >
                        </div>
            
                        <!-- Contraseña -->
                        <div>
                            <label
                                for="password"
                                class="block text-sm font-medium text-[#756c59] mb-2"
                            >
                            Contraseña
                            </label>
                            <input
                                id="password"
                                type="password"
                                name="password"
                                autocomplete="current-password"
                                placeholder="Introduce tu contraseña"
                                class="w-full rounded-xl border border-[#d3c7b6] bg-[#faf8f4] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#8d917b]"
                            >
                        </div>
            
                        <!-- Botón -->
                        <div class="pt-2">
                            <button
                                type="submit"
                                class="w-full bg-[#8d917b] text-white py-3 rounded-xl font-medium shadow-sm hover:bg-[#756c59] transition"
                            >
                            Iniciar sesión
                            </button>
                        </div>
                    </form>
        
                    <!-- Registro -->
                    <div class="mt-8 border-t border-[#e6ded2] pt-6 text-center">
                        <p class="text-[#8d917b] text-sm">
                            ¿Todavía no tienes una cuenta?
                            <a
                                routerLink="/user/register"
                                class="font-medium text-[#756c59] hover:underline ml-1"
                            >
                            Regístrate aquí
                            </a>
                        </p>
                    </div>
        
                </div>
    
            </div>
  
        </div>
  
    </main>
  
    <app-footer></app-footer>
  
  </div>
