<div class="bg-[#efe8da] min-h-screen pt-24 px-6">

    <!-- Header admin -->
    <app-header-admin></app-header-admin>
  
    <!-- Card formulario -->
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm p-8">
  
      <!-- Título -->
      <div class="mb-8">
  
        <h1 class="text-2xl font-semibold text-[#756c59]">
          Crear producto
        </h1>
  
        <p class="text-sm text-[#8d917b] mt-1">
          Añade un nuevo producto a la tienda
        </p>
  
      </div>
  
      <!-- Formulario -->
      <form class="space-y-6">
  
        <!-- Nombre -->
        <div>
  
          <label class="block text-sm font-medium text-[#756c59] mb-2">
            Nombre
          </label>
  
          <input
            type="text"
            placeholder="Introduce el nombre del producto"
            class="w-full rounded-xl border border-[#d3c7b6] px-4 py-3 bg-[#faf8f4] focus:outline-none focus:ring-2 focus:ring-[#8d917b]"
          >
  
        </div>
  
        <!-- Descripción -->
        <div>
  
          <label class="block text-sm font-medium text-[#756c59] mb-2">
            Descripción
          </label>
  
          <textarea
            rows="4"
            placeholder="Describe el producto"
            class="w-full rounded-xl border border-[#d3c7b6] px-4 py-3 bg-[#faf8f4] focus:outline-none focus:ring-2 focus:ring-[#8d917b]"
          ></textarea>
  
        </div>
  
        <!-- Precio -->
        <div>
  
          <label class="block text-sm font-medium text-[#756c59] mb-2">
            Precio
          </label>
  
          <input
            type="number"
            step="any"
            placeholder="0.00"
            class="w-full rounded-xl border border-[#d3c7b6] px-4 py-3 bg-[#faf8f4] focus:outline-none focus:ring-2 focus:ring-[#8d917b]"
          >
  
        </div>
  
        <!-- Imagen -->
        <div>
  
          <label class="block text-sm font-medium text-[#756c59] mb-2">
            Imagen
          </label>
  
          <input
            type="file"
            class="block w-full text-sm text-[#756c59]
            file:mr-4 file:py-2 file:px-4
            file:rounded-lg file:border-0
            file:bg-[#bfc4ab]
            file:text-[#756c59]
            hover:file:bg-[#8d917b]
            hover:file:text-white"
          >
  
        </div>
  
        <!-- Botón -->
        <div class="pt-4">
  
          <button
            type="submit"
            class="bg-[#8d917b] text-white px-6 py-3 rounded-xl hover:bg-[#756c59] transition shadow-sm"
          >
            Guardar producto
          </button>
  
        </div>
  
      </form>
  
    </div>
  
  </div>
